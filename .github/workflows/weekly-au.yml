name: weekly-au-specials
on:
  schedule:
    - cron: "0 2 * * 3"   # Wednesday 12:00 AEST, after the new specials go live
  workflow_dispatch:
permissions:
  contents: write
concurrency: site-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AU specials from Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python fetch_au.py
      - name: Build site
        run: python build.py
      - name: Commit
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update AU specials $(date -u +%F)"
          git pull --rebase -q
          git push
