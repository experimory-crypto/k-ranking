name: daily-ranking
on:
  schedule:
    - cron: "30 0 * * *"   # 09:30 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rankings from Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python fetch.py
      - name: Build site
        run: python build.py
      - name: Commit
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update rankings $(date -u +%F)"
          git push
